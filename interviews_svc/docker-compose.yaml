services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: vibecode_interviews
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vibecode_interviews"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - vibecode-net

  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    environment:
      PGPASSWORD: postgres
    command: >
      sh -lc "
      for f in $$(ls -1 /migrations/*.sql | sort); do
        echo applying $$f;
        psql -h db -U postgres -d vibecode_interviews -f $$f;
      done
      "
    restart: "no"
    networks:
     - vibecode-net

  api:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/vibecode_interviews?sslmode=disable"

      # JWT проверяем локально, должно совпадать с auth_users
      JWT_SECRET: "supersecret"
      JWT_ISSUER: "vibecode-auth"

      # internal key для /internal/* interviews
      INTERNAL_API_KEY: "superinternalkey-interviews"

      # доступ к auth_users internal
      AUTH_BASE_URL: "http://auth-users-api:8080"
      AUTH_INTERNAL_API_KEY: "superinternalkey"

      # базовая ссылка, которую отдаём HR (как шаблон)
      INVITE_BASE_URL: "https://app.example.com/invite"

      # дефолтная жизнь инвайта (минуты), если в запросе не передали
      INVITE_TTL_MINUTES: "4320"

      REQUEST_MAX_MB: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8082:8080"
    networks:
      - vibecode-net

volumes:
  pgdata:
networks:
  vibecode-net:
    external: true