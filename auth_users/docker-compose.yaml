services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: vibecode_auth
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vibecode_auth"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - vibecode-net

  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    environment:
      PGPASSWORD: postgres
    command: >
      sh -lc "
      for f in $$(ls -1 /migrations/*.sql | sort); do
        echo applying $$f;
        psql -h db -U postgres -d vibecode_auth -f $$f;
      done
      "
    restart: "no"
    networks:
      - vibecode-net



  api:
    container_name: auth-users-api
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/vibecode_auth?sslmode=disable"
      JWT_SECRET: "supersecret"
      JWT_ISSUER: "vibecode-auth"
      JWT_TTL_MINUTES: "1440"
      INTERNAL_API_KEY: "superinternalkey"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    networks:
      - vibecode-net
volumes:
  pgdata:
networks:
  vibecode-net:
    external: true